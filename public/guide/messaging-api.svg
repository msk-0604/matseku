  <circle cx="172" cy="88" r="12" fill="#e11d48"/><text x="168" y="93" font-size="13" font-weight="bold" fill="#fff">1</text>
  <text x="206" y="50" font-size="16" font-weight="bold" fill="#222">Messaging API</text>
  <text x="206" y="80" font-size="13" fill="#555">Messaging APIを利用するには、プロバイダーを選択してください。</text>
  <rect x="206" y="100" width="190" height="40" rx="6" fill="#06c755" stroke="#e11d48" stroke-width="3"/>
